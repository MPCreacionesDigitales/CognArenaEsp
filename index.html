    body {

    }

    .glow-orange {
      box-shadow: 0 0 25px -2px rgba(249, 115, 22, 0.55);
    }
    .glow-cyan {
      box-shadow: 0 0 25px -2px rgba(6, 182, 212, 0.6);

    .glow-fuchsia {

    }
    .glow-emerald {

    }
    .glow-amber {
      box-shadow: 0 0 25px -2px rgba(245, 158, 11, 0.6);
    }
    .glow-dual {
      box-shadow: 0 0 30px -4px rgba(249, 115, 22, 0.4), 0 0 30px -4px rgba(6, 182, 212, 0.4);
    }

    .glass-arena {
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.68);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    @keyframes spinCustom {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spinCustom 2s linear infinite;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #06b6d4;
      border-radius: 9999px;
    }
  </style>
</head>

      let state = {
        activeTab: 'hub', // 'hub', 'test', 'results'
        activeModuleId: null,
        currentQuestionIdx: 0,
        userProfile: {
          name: '',

          realAge: 32,
          isRegistered: false,
          role: 'Estratega / Profesional',

        startTime: null,
        timerInterval: null,
        completedHistory: {}
      };

      function init() {
        try {
          const savedData = localStorage.getItem('cognarena_global_v1');
          if (savedData) {
            const parsed = JSON.parse(savedData);
            if (parsed.userProfile) state.userProfile = parsed.userProfile;
            if (parsed.completedHistory) state.completedHistory = parsed.completedHistory;
          }
        } catch (e) {
          console.error("Error al cargar datos locales:", e);
        }
        render();
      }

      function saveGlobalState() {
        try {
          localStorage.setItem('cognarena_global_v1', JSON.stringify({
            userProfile: state.userProfile,
            completedHistory: state.completedHistory
          }));
        } catch(e){}
      }

      function startTimer() {
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.elapsedSeconds = 0;
        state.startTime = Date.now();

        state.timerInterval = setInterval(() => {
          state.elapsedSeconds += 1;
          updateTimerUI();
        }, 1000);
      }

      function updateTimerUI() {
        const timerEl = document.getElementById('timer-display');
        if (timerEl) {
          const mins = Math.floor(state.elapsedSeconds / 60);
          const secs = state.elapsedSeconds % 60;
          const formatted = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
          timerEl.className = 'flex items-center space-x-1.5 font-mono font-bold text-base text-cyan-300';
          timerEl.innerHTML = ICONS.clock + ' <span>' + formatted + '</span>';
        }
      }

      function handleOptionSelect(option) {
        if (state.timerInterval) clearInterval(state.timerInterval);

        const endTime = Date.now();
        const responseTimeMs = endTime - (state.startTime || endTime);
        const modConfig = MODULES_DB[state.activeModuleId];
        const currentQ = modConfig.questions[state.currentQuestionIdx];

        const points = option ? (option.score || 0) : 0;
        const feedback = option ? (option.feedback || "Respuesta procesada correctamente.") : "";

        state.responses.push({
          questionId: currentQ.id,
          title: currentQ.title,
          difficulty: currentQ.difficulty,
          responseTimeMs,
          points,
          feedback
        });

        if (state.currentQuestionIdx + 1 < modConfig.questions.length) {
          state.currentQuestionIdx += 1;
          render();
          startTimer();
        } else {
          finishTestModule();
        }
      }

      function finishTestModule() {
        const modConfig = MODULES_DB[state.activeModuleId];
        const totalPoints = state.responses.reduce((acc, r) => acc + r.points, 0);
        const maxPoints = modConfig.questions.length * 100;
        const accuracyPct = totalPoints / maxPoints;
        const score = Math.round(accuracyPct * 1000);

        const avgTimeMs = Math.round(
          state.responses.reduce((acc, r) => acc + r.responseTimeMs, 0) / state.responses.length
        );

        let extraMeta = {};
        if (state.activeModuleId === 'nam') {
          const realAge = parseInt(state.userProfile.realAge, 10) || 32;
          let ageDelta = 0;
          if (accuracyPct >= 0.90) ageDelta -= 8;
          else if (accuracyPct >= 0.75) ageDelta -= 4;
          else if (accuracyPct < 0.50) ageDelta += 5;
          extraMeta.brainAge = Math.max(18, realAge + ageDelta);
        } else if (state.activeModuleId === 'bta') {
          const titles = ["El Arquitecto Visio-Espacial", "El Estratega Secuencial", "El Sintetizador Intuitivo", "El Operador Táctico"];
          extraMeta.archetype = titles[Math.floor(Math.random() * titles.length)];
        }

        const resultObj = {
          date: new Date().toLocaleDateString('es-ES', { day: '2-digit', month: 'short', year: 'numeric' }),
          score,
          accuracyPct: Math.round(accuracyPct * 100),
          avgTimeMs,
          extraMeta,
          responses: [...state.responses]
        };

        state.completedHistory[state.activeModuleId] = resultObj;
        saveGlobalState();

        state.activeTab = 'results';
        render();
      }

                <span>PREGUNTA ${state.currentQuestionIdx + 1} DE ${modConfig.questions.length} [${progressPct}%]</span>
              </div>
              <div class="w-full bg-slate-900 h-2.5 rounded-full p-0.5 border border-slate-800 overflow-hidden">
                <div 
                  class="bg-gradient-to-r from-orange-500 via-fuchsia-500 to-cyan-400 h-full rounded-full transition-all duration-500 ease-out glow-cyan"
                  style="width: ${progressPct}%"
                ></div>
              </div>
            </div>

            <!-- QUESTION CARD -->
            <div class="glass-card p-6 rounded-3xl border border-slate-700/80 space-y-6 relative overflow-hidden">
              <div class="border-b border-slate-800 pb-3">
                <span class="text-[10px] font-mono font-bold text-orange-400 uppercase tracking-widest block mb-1">
                  // ${modConfig.acronym} - DESAFÍO MENTAL //
                </span>
                <h3 class="text-xl font-black text-white">${q.title}</h3>
              </div>

              <!-- INSTRUCTION HUD -->
              <div class="bg-slate-900/90 p-4 rounded-2xl border border-cyan-500/30 text-sm text-slate-100 leading-relaxed shadow-inner flex items-start gap-3">
                <span class="text-cyan-400 flex-shrink-0 mt-0.5">${ICONS.alertCircle}</span>
                <div class="font-medium">${q.instructions}</div>
              </div>

              <!-- OPTIONS MATRIX -->
              <div class="space-y-3 pt-2">
                ${q.options.map((opt, idx) => `
                  <button
                    data-opt-idx="${idx}"
                    class="btn-option w-full text-left p-4 rounded-2xl border border-slate-700/80 transition-all duration-200 hover:border-cyan-400 hover:bg-slate-800/90 active:scale-[0.99] bg-slate-900/60 flex items-center justify-between group"
                  >
                    <span class="text-sm font-semibold text-slate-100 group-hover:text-cyan-200 transition-colors">
                      ${opt.text}
                    </span>
                    <span class="text-slate-500 group-hover:text-cyan-400 transition-transform group-hover:translate-x-1 flex-shrink-0 ml-3">
                      ${ICONS.chevronRight}
                    </span>
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      function renderResultsScreen() {
        const modConfig = MODULES_DB[state.activeModuleId];
        const res = state.completedHistory[state.activeModuleId];
        if (!res) return '<div>No hay datos de resultados disponibles.</div>';

        const shareText = `🧠 CognArena (${modConfig.acronym}): ¡Alcancé un puntaje de ${res.score}/1000 pts en '${modConfig.name}'! Tiempo medio: ${(res.avgTimeMs / 1000).toFixed(1)}s por acertijo. ¿Puedes superarme? 🔥`;
        const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;

        return `
          <div class="space-y-8 max-w-3xl mx-auto">
            <!-- RESULTS SCORECARD BANNER -->
            <div class="bg-gradient-to-br from-slate-950 via-slate-900 to-indigo-950 text-white p-6 sm:p-8 rounded-3xl border border-cyan-500/40 shadow-2xl relative overflow-hidden glow-cyan">
              <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-6">
                <div class="space-y-3 text-center md:text-left">
                  <span class="inline-block bg-slate-900/90 text-cyan-300 text-[10px] font-mono px-3 py-1 rounded-full border border-cyan-500/40">
                    DIAGNÓSTICO // ${modConfig.acronym} COMPLETADO
                  </span>
                  <h2 class="text-3xl font-black text-white">
                    ${state.userProfile.name || 'Desafiante'}
                  </h2>
                  <p class="text-xs text-slate-300 font-medium">
                    Edad: <span class="text-cyan-300 font-mono font-bold">${state.userProfile.realAge} años</span> | Latencia media: <span class="text-emerald-400 font-mono font-bold">${(res.avgTimeMs / 1000).toFixed(2)}s</span>
                  </p>

                  ${res.extraMeta.brainAge ? `
                    <div class="inline-block px-3.5 py-1.5 rounded-xl border border-emerald-500/40 bg-emerald-950/80 text-xs font-mono font-bold text-emerald-300">
                      EDAD CEREBRAL CALCULADA: ${res.extraMeta.brainAge} AÑOS
                    </div>
                  ` : ''}

                  ${res.extraMeta.archetype ? `
                    <div class="inline-block px-3.5 py-1.5 rounded-xl border border-emerald-500/40 bg-emerald-950/80 text-xs font-mono font-bold text-emerald-300">
                      ARQUETIPO: ${res.extraMeta.archetype}
                    </div>
                  ` : ''}
                </div>

                <!-- SCORE HIGHLIGHT BOX -->
                <div class="glass-card p-6 rounded-2xl border border-cyan-400/40 text-center min-w-[220px] glow-cyan">
                  <div class="text-[10px] font-mono uppercase tracking-widest text-slate-400">Puntaje Mapeado</div>
                  <div class="text-4xl sm:text-5xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-cyan-300 to-emerald-400 my-1 font-mono">
                    ${res.score}
                    <span class="text-xs text-slate-500 font-normal">/1000</span>
                  </div>
                  <div class="text-[11px] font-mono text-emerald-400 font-bold border-t border-slate-800 pt-2 mt-1">
                    Precisión: ${res.accuracyPct}%
                  </div>
                </div>
              </div>
            </div>

            <!-- VIRAL FAN PAGE SHARE HUB -->
            <div class="glass-card p-6 rounded-3xl border border-fuchsia-500/40 space-y-4 glow-fuchsia relative overflow-hidden">
              <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b border-slate-800 pb-3">
                <div>
                  <span class="text-[10px] font-mono font-bold text-fuchsia-400 uppercase tracking-widest block mb-0.5">
                    // RETO SOCIAL EN COMUNIDAD
                  </span>
                  <h3 class="text-base font-extrabold text-white flex items-center gap-2">
                    ${ICONS.share} Publica tu Resultado en Nuestra Fan Page
                  </h3>
                </div>
                <span class="text-[11px] font-mono text-emerald-400 font-semibold bg-emerald-950/80 px-2.5 py-1 rounded-lg border border-emerald-500/30">
                  +100 pts de Orgullo Mental
                </span>
              </div>

              <p class="text-xs text-slate-300 leading-relaxed">
                Copia tu tarjeta de diagnóstico oficial y pégala en los comentarios de nuestra Fan Page para comparar con otros miembros de la comunidad:
              </p>

              <!-- COPYABLE TEXTAREA -->
              <div class="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 text-xs font-mono text-cyan-300 relative">
                <textarea 
                  id="share-text-input" 
                  readonly 
                  rows="2"
                  class="w-full bg-transparent border-none outline-none resize-none text-slate-200 text-xs font-mono"
                >${shareText}</textarea>
              </div>

              <!-- ACTION BUTTONS GRID -->
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button
                  id="btn-copy-result"
                  class="py-3 px-4 rounded-xl bg-cyan-950 hover:bg-cyan-900 text-cyan-300 border border-cyan-500/40 font-bold text-xs transition-all flex items-center justify-center gap-2 glow-cyan"
                >
                  <span>${ICONS.copy}</span>
                  <span id="copy-btn-label">1. Copiar Resultado</span>
                </button>

                <a
                  href="https://www.facebook.com/profile.php?id=61593587577733"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20"
                >
                  <span class="text-white">${ICONS.facebook}</span>
                  <span>2. Ir a nuestra Fan Page</span>
                </a>

                <a
                  href="${whatsappUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="py-3 px-4 rounded-xl bg-emerald-950 hover:bg-emerald-900 text-emerald-300 border border-emerald-500/40 font-bold text-xs transition-all flex items-center justify-center gap-2"
                >
                  <span class="text-emerald-400">${ICONS.whatsapp}</span>
                  <span>Enviar x WhatsApp</span>
                </a>
              </div>
            </div>

            <!-- FEEDBACK BREAKDOWN -->
            <div class="glass-card p-6 rounded-3xl border border-slate-700/80 space-y-5">
              <h3 class="text-xs font-mono font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                <span>${ICONS.fileText}</span> Auditoría Módulo por Módulo (12 Pruebas)
              </h3>

              <div class="space-y-3 max-h-96 overflow-y-auto pr-1">
                ${res.responses.map(resp => `
                  <div class="bg-slate-900/80 p-4 rounded-2xl border border-slate-800 text-xs space-y-2">
                    <div class="flex justify-between items-center">
                      <div class="flex items-center space-x-2">
                        <span class="font-bold text-slate-200">${resp.title}</span>
                        <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">
                          ${resp.difficulty}
                        </span>
                      </div>
                      <span class="px-2.5 py-0.5 rounded font-mono font-bold ${
                        resp.points >= 70 ? 'bg-emerald-950 text-emerald-300 border border-emerald-500/30' : 'bg-amber-950 text-amber-300 border border-amber-500/30'
                      }">
                        ${resp.points} pts
                      </span>
                    </div>
                    <p class="text-slate-400 leading-relaxed">${resp.feedback}</p>
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- NAVIGATION ACTIONS -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-2">
              <button
                id="btn-return-hub"
                class="w-full sm:w-auto px-6 py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-cyan-500 hover:from-orange-400 hover:to-cyan-400 text-slate-950 font-black text-xs tracking-wider uppercase transition-all flex items-center justify-center space-x-2 shadow-lg"
              >
                <span>${ICONS.home}</span>
                <span>VOLVER AL MENÚ PRINCIPAL COGNARENA</span>
              </button>

              <div class="text-xs text-slate-500 font-mono text-center sm:text-right">
                PROGRESO GUARDADO EN NAVEGADOR LOCAL
              </div>
            </div>
          </div>
        `;
      }

      function bindEvents() {
        const btnHeaderHome = document.getElementById('btn-header-home');
        if (btnHeaderHome) {
          btnHeaderHome.addEventListener('click', () => {
            if (state.userProfile.isRegistered) {
              state.activeTab = 'hub';
              render();
            }
          });
        }

        if (!state.userProfile.isRegistered || !state.userProfile.email) {
          const regForm = document.getElementById('registration-gate-form');
          if (regForm) {
            regForm.addEventListener('submit', (e) => {
              e.preventDefault();
              const nameInput = document.getElementById('input-gate-name');
              const emailInput = document.getElementById('input-gate-email');
              const ageInput = document.getElementById('input-gate-age');

              if (nameInput && emailInput && ageInput) {
                state.userProfile.name = nameInput.value.trim();
                state.userProfile.email = emailInput.value.trim();
                state.userProfile.realAge = parseInt(ageInput.value, 10) || 32;
                state.userProfile.isRegistered = true;
                saveGlobalState();
                state.activeTab = 'hub';
                render();
              }
            });
          }
          return;
        }

        const btnNavHub = document.getElementById('btn-nav-hub');
        if (btnNavHub) {
          btnNavHub.addEventListener('click', () => {
            state.activeTab = 'hub';
            render();
          });
        }

        if (state.activeTab === 'hub') {
          const btnEditProfile = document.getElementById('btn-edit-profile');
          if (btnEditProfile) {
            btnEditProfile.addEventListener('click', () => {
              state.userProfile.isRegistered = false;
              render();
            });
          }

          const launchBtns = document.querySelectorAll('.btn-launch-mod');
          launchBtns.forEach(btn => {
            btn.addEventListener('click', () => {
              const modId = btn.getAttribute('data-launch-mod');
              state.activeModuleId = modId;
              state.currentQuestionIdx = 0;
              state.responses = [];
              state.activeTab = 'test';
              render();
              startTimer();
            });
          });
        } else if (state.activeTab === 'test') {
          const optionBtns = document.querySelectorAll('.btn-option');
          optionBtns.forEach(btn => {
            btn.addEventListener('click', () => {
              const optIdx = parseInt(btn.getAttribute('data-opt-idx'), 10);
              const modConfig = MODULES_DB[state.activeModuleId];
              const q = modConfig.questions[state.currentQuestionIdx];
              const selectedOpt = q.options[optIdx];
              handleOptionSelect(selectedOpt);
            });
          });
        } else if (state.activeTab === 'results') {
          const btnReturn = document.getElementById('btn-return-hub');
          if (btnReturn) {
            btnReturn.addEventListener('click', () => {
              state.activeTab = 'hub';
              render();
            });
          }

          const btnCopy = document.getElementById('btn-copy-result');
          if (btnCopy) {
            btnCopy.addEventListener('click', () => {
              const textInput = document.getElementById('share-text-input');
              if (textInput) {
                textInput.select();
                textInput.setSelectionRange(0, 99999);
                try {
                  document.execCommand('copy');
                  const label = document.getElementById('copy-btn-label');
                  if (label) {
                    label.textContent = "¡Copiado!";
                    setTimeout(() => {
                      label.textContent = "1. Copiar Resultado";
                    }, 2500);
                  }
                } catch (err) {
                  console.error("Error al copiar texto: ", err);
                }
              }
            });
          }
        }
      }

      window.addEventListener('DOMContentLoaded', init);
      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        init();
      }
    })();
  </script>
</body>
</html>
